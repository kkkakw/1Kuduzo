# Проверка Android-приложения в эмуляторе: запускается пушем в ветку emu-test.
name: Android в эмуляторе

on:
  push:
    branches: [emu-test]

jobs:
  emulator:
    name: Эмулятор API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [29, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Подготовка проекта и ядра Xray
        run: bash scripts/prepare.sh android
      - name: Сборка APK для x86_64
        run: flutter build apk --release --target-platform android-x64
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          pip install --quiet pillow || pip install --quiet --break-system-packages pillow
      - name: Тест в эмуляторе
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/emu_test.sh
