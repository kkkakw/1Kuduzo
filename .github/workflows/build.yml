name: Сборка Kuduzo

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Подготовка проекта и ядра Xray
        run: bash scripts/prepare.sh android
      - name: Проверка кода
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Тесты парсера
        run: flutter test
      - name: Проверка сгенерированных конфигов ядром Xray
        run: |
          chmod +x .dl/xray-linux/xray
          for f in build/xray_test_configs/*.json; do
            XRAY_LOCATION_ASSET=.dl/xray-linux .dl/xray-linux/xray run -test -c "$f" > /tmp/out.txt 2>&1 || { echo "ОШИБКА: $f"; cat /tmp/out.txt; exit 1; }
          done
          echo "Все конфиги приняты ядром"
      - name: Сборка APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: flutter build apk --release --split-per-abi
      - name: Переименование
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/Kuduzo-android-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/Kuduzo-android-armv7.apk
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: *//')
          echo "{\"version\":\"${VER%%+*}\",\"build\":${VER##*+}}" > dist/version.json
          cat dist/version.json
      - uses: actions/upload-artifact@v4
        with:
          name: Kuduzo-Android
          path: dist/*.apk
      - name: Релиз
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Kuduzo — последняя сборка' }}
          make_latest: true
          files: |
            dist/*.apk
            dist/version.json

  windows:
    name: Windows (EXE)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Подготовка проекта и ядра Xray
        shell: bash
        run: bash scripts/prepare.sh windows
      - name: Сборка
        run: flutter build windows --release
      - name: Ядро рядом с программой
        shell: bash
        run: |
          OUT=build/windows/x64/runner/Release
          mkdir -p "$OUT/xray"
          cp .dl/xray-win/xray.exe .dl/xray-win/geoip.dat .dl/xray-win/geosite.dat .dl/xray-win/wintun.dll "$OUT/xray/"
      - name: Архив
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/Kuduzo-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Kuduzo-Windows
          path: dist/*.zip
      - name: Релиз
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Kuduzo — последняя сборка' }}
          make_latest: true
          files: dist/*.zip

  macos:
    name: macOS (APP)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Подготовка проекта и ядра Xray
        run: bash scripts/prepare.sh macos
      - name: Сборка
        run: flutter build macos --release
      - name: Ядро внутрь приложения и подпись
        run: |
          APP="build/macos/Build/Products/Release/Kuduzo VPN.app"
          mkdir -p "$APP/Contents/Resources/xray"
          cp .dl/xray-mac/xray .dl/xray-mac/geoip.dat .dl/xray-mac/geosite.dat "$APP/Contents/Resources/xray/"
          codesign --force --deep --sign - "$APP"
          mkdir -p dist
          ditto -c -k --keepParent "$APP" dist/Kuduzo-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Kuduzo-macOS
          path: dist/*.zip
      - name: Релиз
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Kuduzo — последняя сборка' }}
          make_latest: true
          files: dist/*.zip

  web:
    name: Веб-демо
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Подготовка проекта
        run: bash scripts/prepare.sh web
      - name: Сборка
        run: flutter build web --release --no-web-resources-cdn --pwa-strategy=none || flutter build web --release --pwa-strategy=none
      - name: Архив
        run: |
          sed -i 's|<base href="/">||' build/web/index.html
          mkdir -p dist
          (cd build/web && zip -qr ../../dist/Kuduzo-web-demo.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: Kuduzo-Web
          path: dist/*.zip
      - name: Релиз
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Kuduzo — последняя сборка' }}
          make_latest: true
          files: dist/*.zip

  ios:
    name: iOS (IPA без подписи)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: ios_core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Ядро Xray для iOS (gomobile)
        working-directory: ios_core
        run: |
          go mod tidy
          go install golang.org/x/mobile/cmd/gomobile@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init
          gomobile bind -target=ios -iosversion=15.0 -trimpath -ldflags='-s -w -buildid= -checklinkname=0' -o ../build/ios-core/Kuduzocore.xcframework .
          ls -la ../build/ios-core
      - name: Подготовка проекта
        run: bash scripts/prepare.sh ios
      - name: Network Extension в Xcode-проект
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: *//')
          ruby scripts/ios_add_extension.rb "${VER%%+*}" "${VER##*+}"
      - name: Сборка
        run: |
          flutter build ios --config-only --release --no-codesign || true
          if [ -f ios/Podfile ]; then
            sed -i '' "s/^# platform :ios.*/platform :ios, '15.0'/" ios/Podfile
            grep -n "platform :ios" ios/Podfile || true
          fi
          flutter build ios --release --no-codesign
      - name: IPA
        run: |
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          ls dist/Payload/Runner.app/PlugIns
          (cd dist && zip -qry Kuduzo-VPN-ios-unsigned.ipa Payload && rm -rf Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: Kuduzo-iOS
          path: dist/*.ipa
      - name: Релиз
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Kuduzo — последняя сборка' }}
          make_latest: true
          files: dist/*.ipa
