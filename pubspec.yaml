name: kuduzo
description: Kuduzo — VPN-клиент на базе Xray-core для iOS, Android, macOS и Windows.
publish_to: "none"
version: 0.3.0+3

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  kuduzo_vpn_ios:
    path: packages/kuduzo_vpn_ios
  url_launcher: ^6.3.1
  app_links: ">=6.3.0 <8.0.0"
  mobile_scanner: ">=6.0.0 <8.0.0"
  tray_manager: ">=0.7.0 <0.9.0"
  window_manager: ">=0.4.3 <1.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/tray.ico
    - assets/icon/tray_mac.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
